name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Release APK
      run: |
        keytool -genkey -v -keystore temp.keystore -alias tempkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=EverDialer"
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort | tail -1)
        $APKSIGNER sign --ks temp.keystore --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/*-unsigned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ever-Dialer-Fast-Release
        path: app/build/outputs/apk/release/*.apk
        
